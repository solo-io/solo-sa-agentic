apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-banking-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: core-banking-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-banking-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-banking-mcp
    spec:
      containers:
      - name: core-banking-mcp
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        command:
        - python
        - -c
        args:
        - |
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          SESSION_ID = "mock-core-banking-session"

          TOOLS = [
              {
                  "name": "accounts.get_summary",
                  "description": "Return a deterministic account summary for runtime validation.",
                  "inputSchema": {
                      "type": "object",
                      "properties": {
                          "account_id": {"type": "string"}
                      },
                      "required": ["account_id"],
                  },
              },
              {
                  "name": "transactions.search",
                  "description": "Return deterministic transaction search results for runtime validation.",
                  "inputSchema": {
                      "type": "object",
                      "properties": {
                          "account_id": {"type": "string"},
                          "limit": {"type": "integer"}
                      },
                      "required": ["account_id"],
                  },
              },
              {
                  "name": "accounts.close",
                  "description": "A destructive mock tool that must be blocked by gateway policy.",
                  "inputSchema": {
                      "type": "object",
                      "properties": {
                          "account_id": {"type": "string"}
                      },
                      "required": ["account_id"],
                  },
              },
          ]

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  print("%s - %s" % (self.address_string(), fmt % args), flush=True)

              def _json(self, status, payload, session=False):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(body)))
                  if session:
                      self.send_header("Mcp-Session-Id", SESSION_ID)
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path in ("/healthz", "/readyz"):
                      self._json(200, {"status": "ok"})
                      return
                  self._json(404, {"error": "not found"})

              def do_POST(self):
                  length = int(self.headers.get("content-length", "0"))
                  raw = self.rfile.read(length) if length else b"{}"
                  try:
                      request = json.loads(raw.decode("utf-8"))
                  except Exception:
                      self._json(400, {"jsonrpc": "2.0", "id": None, "error": {"code": -32700, "message": "parse error"}})
                      return

                  method = request.get("method")
                  request_id = request.get("id")

                  if method == "initialize":
                      self._json(200, {
                          "jsonrpc": "2.0",
                          "id": request_id,
                          "result": {
                              "protocolVersion": "2025-06-18",
                              "capabilities": {"tools": {}},
                              "serverInfo": {"name": "core-banking-mcp", "version": "0.1.0"},
                          },
                      }, session=True)
                      return

                  if method == "notifications/initialized":
                      self._json(202, {})
                      return

                  if method == "tools/list":
                      self._json(200, {"jsonrpc": "2.0", "id": request_id, "result": {"tools": TOOLS}})
                      return

                  if method == "tools/call":
                      params = request.get("params") or {}
                      name = params.get("name")
                      args = params.get("arguments") or {}
                      if name == "accounts.get_summary":
                          account_id = args.get("account_id", "acct-001")
                          self._json(200, {
                              "jsonrpc": "2.0",
                              "id": request_id,
                              "result": {
                                  "content": [{"type": "text", "text": "account summary for " + account_id}],
                                  "structuredContent": {
                                      "account_id": account_id,
                                      "account_type": "checking",
                                      "current_balance": "123.45",
                                  },
                              },
                          })
                          return

                      if name == "accounts.close":
                          account_id = args.get("account_id", "acct-001")
                          self._json(200, {
                              "jsonrpc": "2.0",
                              "id": request_id,
                              "result": {
                                  "content": [{"type": "text", "text": "closed account " + account_id}],
                                  "structuredContent": {"account_id": account_id, "status": "closed"},
                              },
                          })
                          return

                      self._json(404, {
                          "jsonrpc": "2.0",
                          "id": request_id,
                          "error": {"code": -32601, "message": "unknown tool"},
                      })
                      return

                  self._json(404, {
                      "jsonrpc": "2.0",
                      "id": request_id,
                      "error": {"code": -32601, "message": "method not found"},
                  })

          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
