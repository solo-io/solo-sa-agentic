apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agw-demo
    namespace: agentgateway-system
  rules:
  - backendRefs:
    - name: httpbin
      namespace: backend
      port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-agw-to-backend
  namespace: backend
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: agentgateway-system
  to:
  - group: ""
    kind: Service
