# MCP backend fronting the demo MCP server, plus the HTTPRoute that exposes it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: demo-mcp
  namespace: agentgateway-system
  labels:
    example.io/system: mcp-ext-guardrails
spec:
  mcp:
    targets:
    - name: demo-mcp
      static:
        host: demo-mcp.agentgateway-system.svc.cluster.local
        port: 8080
        path: /mcp
        protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-mcp
  namespace: agentgateway-system
  labels:
    example.io/system: mcp-ext-guardrails
spec:
  parentRefs:
  - name: mcp-ext-guardrails-gateway
  hostnames:
  - "mcp.example.com"
  # 'localhost' lets MCP Inspector connect to http://localhost:<port>/mcp with no
  # custom Host header (its HTTP client sets Host from the URL authority).
  - "localhost"
  rules:
  - backendRefs:
    - name: demo-mcp
      group: agentgateway.dev
      kind: AgentgatewayBackend
