# ExtMCP guardrail policy server (agentgateway PR #1842).
# Same "stock public image + inline code" idiom as the repo's other mocks, but a
# gRPC server, so it pip-installs grpcio, generates stubs from the inlined
# ext_mcp.proto at start, then serves. Behaviour matches agentgateway's e2e
# testbox: deny tools/call containing "forbidden"; mutate tools/list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: ext-mcp
    example.io/system: mcp-ext-guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ext-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ext-mcp
    spec:
      containers:
      - name: ext-mcp
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 9001
        command:
        - sh
        - -c
        - |
          set -e
          pip install --quiet --disable-pip-version-check grpcio grpcio-tools
          mkdir -p /app && cd /app
          echo "" | base64 -d > ext_mcp.proto
          echo "" | base64 -d > server.py
          exec python server.py
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 24
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ext-mcp
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: ext-mcp
    example.io/system: mcp-ext-guardrails
spec:
  selector:
    app.kubernetes.io/name: ext-mcp
  ports:
  - name: grpc
    port: 9001
    targetPort: grpc
    appProtocol: kubernetes.io/h2c
