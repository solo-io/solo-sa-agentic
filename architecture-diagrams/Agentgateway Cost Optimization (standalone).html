  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b745162b-d3ad-479e-9369-847912efd65b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fd63032a-be51-4f67-a048-ce1469f25ca5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"b745162b-d3ad-479e-9369-847912efd65b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"fd63032a-be51-4f67-a048-ce1469f25ca5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* =====================================================\n     COLORS — Main Palette (from Brandbook \"Main Colors\")\n     ===================================================== */\n  --solo-primary-dark:    #151927;   /* Primary Dark — 50% usage */\n  --solo-primary-grey:    #EDEEF7;   /* Primary Grey — 30% usage */\n  --solo-secondary-blue:  #20B7F3;   /* Secondary Blue — 10% */\n  --solo-white:           #FFFFFF;   /* White — 10% */\n\n  /* Extended palette, derived from sub-brand usage */\n  --solo-electric-blue:   #20B7F3;   /* alias */\n  --solo-electric-purple: #8A3FFC;   /* kagent / agentgateway purple */\n  --solo-deep-purple:     #4C1D95;   /* hero purple gradients */\n\n  /* Neutrals (dark-mode surfaces, observed in product hero screenshots) */\n  --solo-ink-900: #0B0E18;  /* deeper than primary-dark */\n  --solo-ink-800: #151927;  /* primary dark */\n  --solo-ink-700: #1E2337;  /* card on dark */\n  --solo-ink-600: #2A3044;  /* border on dark */\n  --solo-ink-500: #3B4258;  /* muted text on dark */\n  --solo-ink-400: #6B7289;  /* secondary text on dark */\n  --solo-ink-300: #9AA0B5;  /* tertiary */\n\n  /* Neutrals (light-mode surfaces) */\n  --solo-paper-0:   #FFFFFF;\n  --solo-paper-50:  #F6F7FB;\n  --solo-paper-100: #EDEEF7;  /* primary grey */\n  --solo-paper-200: #DEE0EE;\n  --solo-paper-300: #C3C7DC;\n  --solo-paper-400: #9AA0B5;\n\n  /* Semantic */\n  --solo-success: #22C55E;\n  --solo-warning: #F59E0B;\n  --solo-danger:  #EF4444;\n  --solo-info:    #20B7F3;\n\n  /* =====================================================\n     FG / BG ROLES — prefer these in components\n     ===================================================== */\n  /* on dark surface */\n  --bg-0:  var(--solo-ink-900);\n  --bg-1:  var(--solo-ink-800);\n  --bg-2:  var(--solo-ink-700);\n  --bg-3:  var(--solo-ink-600);\n  --fg-1:  #FFFFFF;\n  --fg-2:  #C8CCDB;\n  --fg-3:  #8289A3;\n  --fg-4:  #5A6078;\n  --accent-blue:   var(--solo-electric-blue);\n  --accent-purple: var(--solo-electric-purple);\n  --border-subtle: rgba(255,255,255,0.08);\n  --border-default: rgba(255,255,255,0.12);\n  --border-strong:  rgba(255,255,255,0.24);\n\n  /* =====================================================\n     TYPE\n     ===================================================== */\n  --font-primary:   'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-secondary: 'DM Sans',  ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-mono:      'DM Mono',  ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* Type scale — Figtree for display/headings, DM Sans for body */\n  --fs-display-1: clamp(56px, 7vw, 96px);   /* hero */\n  --fs-display-2: clamp(44px, 5.5vw, 72px); /* page title */\n  --fs-h1: clamp(36px, 4vw, 56px);\n  --fs-h2: clamp(28px, 3vw, 40px);\n  --fs-h3: 24px;\n  --fs-h4: 20px;\n  --fs-h5: 18px;\n  --fs-body-lg: 18px;\n  --fs-body:    16px;\n  --fs-body-sm: 14px;\n  --fs-caption: 12px;\n  --fs-overline: 12px;\n\n  --lh-tight: 1.05;\n  --lh-snug:  1.15;\n  --lh-heading: 1.2;\n  --lh-body:  1.55;\n  --lh-loose: 1.7;\n\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n  --fw-extrabold: 800;\n\n  /* Tracking (letter-spacing) */\n  --tracking-tight: -0.02em;\n  --tracking-snug:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:  0.04em;\n  --tracking-mono-label: 0.06em;  /* DM Mono labels have wide tracking */\n\n  /* =====================================================\n     RADII — noticeably generous; buttons are fully pill\n     ===================================================== */\n  --radius-xs:  4px;\n  --radius-sm:  6px;\n  --radius-md:  10px;\n  --radius-lg:  14px;   /* cards */\n  --radius-xl:  20px;   /* product tiles */\n  --radius-2xl: 28px;   /* hero tiles */\n  --radius-pill: 999px; /* nav bar, buttons, chips */\n\n  /* =====================================================\n     SPACING — 4px base\n     ===================================================== */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-7: 32px;\n  --space-8: 40px;\n  --space-9: 48px;\n  --space-10: 64px;\n  --space-11: 80px;\n  --space-12: 96px;\n  --space-13: 128px;\n\n  /* =====================================================\n     SHADOWS / ELEVATION\n     ===================================================== */\n  --elev-0: none;\n  --elev-1: 0 1px 2px rgba(15, 19, 35, 0.08);\n  --elev-2: 0 4px 12px rgba(15, 19, 35, 0.10);\n  --elev-3: 0 10px 28px rgba(15, 19, 35, 0.14);\n  --elev-4: 0 24px 60px rgba(15, 19, 35, 0.22);\n\n  /* Glows (used behind product marks on dark) */\n  --glow-blue:   0 0 80px rgba(32, 183, 243, 0.35);\n  --glow-purple: 0 0 80px rgba(138, 63, 252, 0.35);\n\n  /* =====================================================\n     MOTION\n     ===================================================== */\n  --ease-standard: cubic-bezier(.2, .6, .2, 1);\n  --ease-out:      cubic-bezier(.16, 1, .3, 1);\n  --ease-in:       cubic-bezier(.4, 0, 1, 1);\n  --dur-fast:   120ms;\n  --dur-base:   200ms;\n  --dur-slow:   400ms;\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 2px var(--solo-electric-blue);\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   Primary voice: Figtree medium for headlines, DM Sans for body,\n   DM Mono for meta/labels (eyebrows, stats, microcopy).\n   ============================================================ */\n\nhtml, body {\n  font-family: var(--font-secondary);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--fg-1);\n  background: var(--bg-1);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Display & Headings → Figtree */\n.display-1, h1.display-1 {\n  font-family: var(--font-primary);\n  font-size: var(--fs-display-1);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n}\n.display-2, h1.display-2 {\n  font-family: var(--font-primary);\n  font-size: var(--fs-display-2);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-tight);\n}\n\nh1 {\n  font-family: var(--font-primary);\n  font-size: var(--fs-h1);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tracking-tight);\n  margin: 0;\n}\nh2 {\n  font-family: var(--font-primary);\n  font-size: var(--fs-h2);\n  font-weight: var(--fw-medium);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tracking-snug);\n  margin: 0;\n}\nh3 {\n  font-family: var(--font-primary);\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-medium);\n  line-height: 1.3;\n  letter-spacing: var(--tracking-snug);\n  margin: 0;\n}\nh4 {\n  font-family: var(--font-primary);\n  font-size: var(--fs-h4);\n  font-weight: var(--fw-medium);\n  line-height: 1.35;\n  margin: 0;\n}\nh5, h6 {\n  font-family: var(--font-primary);\n  font-size: var(--fs-h5);\n  font-weight: var(--fw-semibold);\n  line-height: 1.4;\n  margin: 0;\n}\n\np, .body {\n  font-family: var(--font-secondary);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--fg-2);\n  margin: 0;\n}\n.body-lg {\n  font-size: var(--fs-body-lg);\n  line-height: var(--lh-loose);\n}\n.body-sm { font-size: var(--fs-body-sm); }\n.caption { font-size: var(--fs-caption); color: var(--fg-3); }\n\n/* Monospace eyebrow / overline — appears above hero titles in the product\n   e.g. \"• From the Founders of Istio & Ambient Mesh\", \"• Built in Rust • Linux Foundation Project\" */\n.eyebrow, .overline {\n  font-family: var(--font-mono);\n  font-size: 13px;\n  font-weight: var(--fw-regular);\n  letter-spacing: var(--tracking-mono-label);\n  text-transform: none;  /* NOT uppercase — Solo keeps mono eyebrows lowercase/sentence */\n  color: var(--accent-blue);\n}\n.eyebrow--purple { color: var(--accent-purple); }\n.eyebrow--muted  { color: var(--fg-3); }\n\n/* Stat numbers (big Electric-Blue figures under hero sections) */\n.stat-figure {\n  font-family: var(--font-primary);\n  font-size: 40px;\n  font-weight: var(--fw-medium);\n  color: var(--accent-blue);\n  line-height: 1;\n  letter-spacing: var(--tracking-tight);\n}\n.stat-label {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  color: var(--fg-3);\n  letter-spacing: var(--tracking-mono-label);\n  margin-top: 6px;\n}\n\n/* Code — DM Mono */\ncode, pre, kbd, samp, .code {\n  font-family: var(--font-mono);\n  font-size: 13px;\n}\n\n/* Links */\na {\n  color: var(--accent-blue);\n  text-decoration: none;\n  transition: opacity var(--dur-base) var(--ease-standard);\n}\na:hover { opacity: 0.8; }\n\n/* Utility classes for type mixing */\n.t-figtree   { font-family: var(--font-primary); }\n.t-dmsans    { font-family: var(--font-secondary); }\n.t-dmmono    { font-family: var(--font-mono); }\n.t-muted     { color: var(--fg-3); }\n.t-subtle    { color: var(--fg-2); }\n.t-blue      { color: var(--accent-blue); }\n.t-purple    { color: var(--accent-purple); }\n\n/* ============================================================\n   CORE PATTERNS\n   ============================================================ */\n\n/* Pill nav — the defining chrome element on solo.io */\n.solo-nav-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-7);\n  padding: 10px 10px 10px 24px;\n  border-radius: var(--radius-pill);\n  background: rgba(255,255,255,0.04);\n  border: 1px solid var(--border-subtle);\n  backdrop-filter: blur(18px);\n  -webkit-backdrop-filter: blur(18px);\n}\n\n/* Pill button */\n.solo-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 20px;\n  border-radius: var(--radius-pill);\n  font-family: var(--font-primary);\n  font-size: 14px;\n  font-weight: var(--fw-medium);\n  line-height: 1;\n  border: 1px solid transparent;\n  cursor: pointer;\n  transition: background var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard), opacity var(--dur-base) var(--ease-standard);\n}\n.solo-btn--primary { background: var(--accent-blue); color: #fff; }\n.solo-btn--primary:hover { background: #2AC0FB; }\n.solo-btn--purple  { background: var(--accent-purple); color: #fff; }\n.solo-btn--purple:hover { background: #9C55FF; }\n.solo-btn--ghost   { background: rgba(255,255,255,0.04); color: #fff; border-color: var(--border-default); }\n.solo-btn--ghost:hover { background: rgba(255,255,255,0.08); }\n.solo-btn--dark    { background: #0B0E18; color: #fff; }\n.solo-btn:active   { transform: scale(0.98); }\n\n/* Card on dark — subtle inner glow, no drop shadow */\n.solo-card {\n  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));\n  border: 1px solid var(--border-subtle);\n  border-radius: var(--radius-lg);\n  padding: var(--space-6);\n}\n\n/* Stat tile */\n.solo-stat-tile {\n  padding: 16px 20px;\n  border-radius: var(--radius-md);\n  background: rgba(255,255,255,0.03);\n  border: 1px solid var(--border-subtle);\n}\n<\u002Fstyle>\n  <script src=\"4b44d4bf-9570-43af-8da0-524c0ac1fd19\"><\u002Fscript>\n  <script src=\"30f1d153-384d-4678-892a-23976d1851cc\"><\u002Fscript>\n  <style>\n    @keyframes agwMarch { to { stroke-dashoffset: -28; } }\n    * { box-sizing: border-box; }\n    html, body { margin: 0; background: #0B0E18; }\n    ::-webkit-scrollbar { width: 9px; height: 9px; }\n    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 9px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:1760px;min-height:1000px;background:#0B0E18;color:#fff;font-family:'DM Sans',sans-serif;\">\n\n  <div style=\"height:56px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid rgba(255,255,255,0.08);position:relative;\">\n    <div style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#8289A3;\">reference architecture<\u002Fdiv>\n    <div style=\"position:absolute;left:0;right:0;text-align:center;font-family:'Figtree',sans-serif;font-size:15px;font-weight:500;color:#fff;pointer-events:none;\">agentgateway oss standalone <span style=\"color:#5A6078;\">·<\u002Fspan> cost optimization<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:36px;padding:30px 40px 48px;align-items:flex-start;\">\n\n    <div style=\"width:1200px;flex:0 0 1200px;\">\n      <div>\n        <div style=\"font-family:'DM Mono',monospace;font-size:13px;letter-spacing:0.06em;color:#8A3FFC;\">• cost optimization · token spend · agentgateway<\u002Fdiv>\n        <div style=\"font-family:'Figtree',sans-serif;font-weight:500;font-size:34px;line-height:1.12;letter-spacing:-0.02em;color:#fff;max-width:820px;margin-top:14px;\">Every token your agents spend, priced and recorded at the gateway.<\u002Fdiv>\n        <div style=\"font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;color:#C8CCDB;max-width:760px;margin-top:14px;\">agentgateway oss runs as a single standalone container, routing llm and mcp traffic for four providers. It prices every request against a model catalog and writes the cost to a local store. Hover a step or a numbered hop to trace the path from request to dashboard.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;\">\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.04em;color:#9AA0B5;padding:5px 11px;border:1px solid rgba(255,255,255,0.12);border-radius:999px;\"><span style=\"width:8px;height:8px;border-radius:2px;border:1px dashed #8A3FFC;\"><\u002Fspan>container boundary<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.04em;color:#9AA0B5;padding:5px 11px;border:1px solid rgba(255,255,255,0.12);border-radius:999px;\"><span style=\"width:16px;height:2px;background:#8A3FFC;border-radius:2px;\"><\u002Fspan>data flow<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.04em;color:#9AA0B5;padding:5px 11px;border:1px solid rgba(255,255,255,0.12);border-radius:999px;\"><span style=\"width:13px;height:13px;border-radius:999px;border:1px solid #8289A3;\"><\u002Fspan>numbered hop<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;width:1200px;height:860px;margin-top:24px;\">\n        <sc-if value=\"{{ binaryOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ binaryStyle }}\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ boundaries }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <div style=\"{{ b.boxStyle }}\"><div style=\"{{ b.pillStyle }}\">{{ b.label }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n        {{ edgesSvg }}\n        <sc-for list=\"{{ nodes }}\" as=\"node\" hint-placeholder-count=\"8\">\n          <div style=\"{{ node.boxStyle }}\">\n            <div style=\"{{ node.tileStyle }}\">{{ node.iconEl }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;\">\n              <div style=\"font-family:'Figtree',sans-serif;font-weight:500;font-size:15px;color:#fff;line-height:1.15;\">{{ node.title }}<\u002Fdiv>\n              <div style=\"font-family:'DM Sans',sans-serif;font-size:12px;color:#8289A3;line-height:1.3;\">{{ node.sub }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;\">\n                <sc-for list=\"{{ node.chips }}\" as=\"c\" hint-placeholder-count=\"1\">\n                  <span style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#9AA0B5;padding:3px 7px;border:1px solid rgba(255,255,255,0.14);border-radius:6px;background:rgba(255,255,255,0.03);white-space:nowrap;\">{{ c }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ badges }}\" as=\"bd\" hint-placeholder-count=\"8\">\n          <div style=\"{{ bd.style }}\" onclick=\"{{ bd.onClick }}\" onmouseenter=\"{{ bd.onEnter }}\" onmouseleave=\"{{ bd.onLeave }}\">{{ bd.n }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:440px;flex:0 0 440px;position:sticky;top:24px;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\">\n        <div style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#8289A3;\">• flow · 8 steps<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.04em;color:#C8CCDB;padding:6px 13px;border:1px solid rgba(255,255,255,0.16);border-radius:999px;cursor:pointer;white-space:nowrap;\" onclick=\"{{ showAll }}\">show all<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:3px;\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div style=\"{{ s.rowStyle }}\" onclick=\"{{ s.onClick }}\" onmouseenter=\"{{ s.onEnter }}\" onmouseleave=\"{{ s.onLeave }}\">\n            <div style=\"{{ s.numStyle }}\">{{ s.numLabel }}<\u002Fdiv>\n            <div style=\"min-width:0;flex:1;\">\n              <div style=\"font-family:'Figtree',sans-serif;font-weight:500;font-size:14px;color:#fff;line-height:1.25;\">{{ s.title }}<\u002Fdiv>\n              <div style=\"font-family:'DM Sans',sans-serif;font-size:12.5px;color:#8289A3;line-height:1.4;margin-top:3px;\">{{ s.summary }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:18px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.012));border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:20px;\">\n        <div style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.06em;color:#B79CFF;\">step {{ detail.numLabel }}<\u002Fdiv>\n        <div style=\"font-family:'Figtree',sans-serif;font-weight:500;font-size:19px;color:#fff;margin-top:7px;line-height:1.2;\">{{ detail.title }}<\u002Fdiv>\n        <div style=\"font-family:'DM Sans',sans-serif;font-
